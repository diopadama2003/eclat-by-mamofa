<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éclat by Mamofa — Mon espace</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #FAF6EE; color: #222; }
    header { background: #16213E; color: white; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; }
    .logo-img { height: 65px; display: block; }
    .nav-liens { display: flex; gap: 16px; align-items: center; }
    .nav-liens a { color: white; text-decoration: none; font-size: 0.9rem; }
    .nav-liens a:hover { text-decoration: underline; }
    #btn-deconnexion { background: none; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
    .conteneur { max-width: 600px; margin: 30px auto; padding: 0 16px; }
    .carte { background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; }
    .carte h2 { margin-top: 0; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 14px; }
    input, textarea { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; font-family: Arial, sans-serif; }
    button { background: #16213E; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { font-size: 0.9rem; font-weight: bold; min-height: 20px; }

    .aide-champ {
      font-weight: normal;
      color: #888;
      font-size: 0.78rem;
    }
    .apercus-multiples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .apercus-multiples img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
        .apercu-avec-suppr {
      position: relative;
    }
    .btn-suppr-apercu {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #D6336C;
      color: white;
      border: none;
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .grille-mes-produits {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .mini-carte-produit {
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      background: #FBF8F1;
    }
    .mini-carte-produit img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
      background: #eee;
    }
    .mini-carte-produit .infos {
      padding: 8px 10px;
    }
    .mini-carte-produit .nom {
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0 0 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-carte-produit .prix {
      font-size: 0.82rem;
      color: #D6336C;
      font-weight: bold;
      margin: 0 0 8px;
    }
    .mini-carte-produit button {
      width: 100%;
      background: #D6336C;
      padding: 6px;
      font-size: 0.75rem;
      border-radius: 6px;
    }

    .carte-commande {
      background: #FBF8F1;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .carte-commande .entete {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .carte-commande .client-nom {
      font-weight: bold;
      font-size: 0.95rem;
    }
    .carte-commande .client-tel {
      font-size: 0.8rem;
      color: #888;
    }
    .carte-commande .sous-total {
      font-weight: bold;
      color: #D6336C;
      font-size: 0.95rem;
    }
    .carte-commande .livraison {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 8px;
    }
    .carte-commande ul {
      margin: 0 0 10px;
      padding-left: 18px;
      font-size: 0.88rem;
    }
    .pied-commande {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .statut-select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 0.82rem;
      background: white;
    }
    .btn-suppr-commande {
      background: none;
      color: #D6336C;
      border: 1px solid #D6336C;
      padding: 4px 10px;
      font-size: 0.78rem;
      border-radius: 6px;
    }
    .vide {
      color: #888;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      header {
        flex-wrap: wrap;
        padding: 10px 14px;
        row-gap: 8px;
      }
      .logo-img {
        height: 42px;
      }
      .nav-liens {
        gap: 12px;
      }
      .nav-liens a {
        font-size: 0.8rem;
      }
      #btn-deconnexion {
        font-size: 0.8rem;
        padding: 5px 10px;
      }
      .conteneur {
        margin: 16px auto;
        padding: 0 12px;
      }
      .carte {
        padding: 16px;
      }
      .grille-mes-produits {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
      }
      .carte-commande {
        padding: 12px;
      }
      .pied-commande {
        flex-wrap: wrap;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html"><img src="image/logo.png" alt="Éclat by Mamofa" class="logo-img"></a>
    <nav class="nav-liens">
      <a href="index.html">Accueil</a>
      <a href="vendeur.html">Devenir vendeur</a>
    </nav>
    <button id="btn-deconnexion">Se déconnecter</button>
  </header>

  <div class="conteneur">

    <div class="carte">
      <h2>Ajouter un produit</h2>
      <form id="form-produit">
        <label>Nom du produit
          <input type="text" name="nom" required>
        </label>
        <label>Prix (F CFA)
          <input type="number" name="prix" required min="0">
        </label>
        <label>Catégorie
          <input type="text" name="categorie" required placeholder="Alimentation, Vêtements, Parfums...">
        </label>
        <label>Photos du produit <span class="aide-champ">(tu peux en choisir plusieurs à la fois, ex: chaque couleur/variante)</span>
          <input type="file" name="images" accept="image/*" required id="champ-image" multiple>
          <div id="apercus-multiples" class="apercus-multiples"></div>
        </label>
        <button type="submit" id="btn-publier">Publier le produit</button>
      </form>
      <p class="message" id="message-produit"></p>
    </div>

    <div class="carte">
      <h2>Mes produits</h2>
      <div id="liste-mes-produits" class="grille-mes-produits">Chargement...</div>
    </div>

    <div class="carte">
      <h2>Mes commandes</h2>
      <div id="liste-mes-commandes">Chargement...</div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    const IMGBB_API_KEY = "205f355eb54fb27d85eb89fcb0ea69c5";
    const STATUTS_COMMANDE = ["en attente", "confirmée", "en livraison", "livrée"];

    let vendeurConnecte = null;

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "vendeur.html";
        return;
      }
      vendeurConnecte = user;

      const doc = await db.collection("vendeurs").doc(user.uid).get();
      const data = doc.data();
      const statut = data ? data.statut : "en_attente";

      if (statut === "en_attente") {
        document.querySelector(".carte").innerHTML = `
          <h2>Compte en attente</h2>
          <p>Ton compte est en attente de validation par l'administrateur.
          Tu recevras un email avec un code dès que ton compte sera accepté.
          Reviens sur cette page et actualise-la à ce moment-là.</p>
          <button id="btn-actualiser">Actualiser</button>
        `;
        document.getElementById("btn-actualiser").addEventListener("click", () => location.reload());
        return;
      }

      if (statut === "refuse") {
        document.querySelector(".carte").innerHTML = `
          <h2>Compte refusé</h2>
          <p>Ton inscription en tant que vendeur n'a pas été acceptée. Contacte l'administrateur pour plus d'informations.</p>
        `;
        return;
      }

      if (statut === "code_envoye") {
        document.querySelector(".carte").innerHTML = `
          <h2>Confirme ton compte</h2>
          <p>Un code de confirmation à 6 chiffres t'a été envoyé par email. Entre-le ici :</p>
          <form id="form-code">
            <label>Code de confirmation
              <input type="text" name="code" required maxlength="6">
            </label>
            <button type="submit">Confirmer</button>
          </form>
          <p class="message" id="message-code"></p>
        `;
        document.getElementById("form-code").addEventListener("submit", async (e) => {
          e.preventDefault();
          const codeSaisi = e.target.code.value.trim();
          const messageEl = document.getElementById("message-code");

          if (codeSaisi !== data.codeConfirmation) {
            messageEl.style.color = "#D6336C";
            messageEl.textContent = "Code incorrect.";
            return;
          }

          await db.collection("vendeurs").doc(user.uid).update({
            statut: "valide",
            codeConfirmation: firebase.firestore.FieldValue.delete(),
          });

          messageEl.style.color = "green";
          messageEl.textContent = "Compte confirmé !";
          setTimeout(() => location.reload(), 1000);
        });
        return;
      }

      chargerMesProduits();
      chargerMesCommandes();
    });

    document.getElementById("btn-deconnexion").addEventListener("click", () => {
      auth.signOut().then(() => (window.location.href = "vendeur.html"));
    });

        const champImage = document.getElementById("champ-image");
    const apercusMultiples = document.getElementById("apercus-multiples");
    let fichiersSelectionnes = [];

    function afficherApercusMultiples() {
      apercusMultiples.innerHTML = fichiersSelectionnes
        .map(
          (fichier, i) => `
          <div class="apercu-avec-suppr">
            <img src="${URL.createObjectURL(fichier)}">
            <button type="button" class="btn-suppr-apercu" data-index="${i}">✕</button>
          </div>`
        )
        .join("");

      apercusMultiples.querySelectorAll(".btn-suppr-apercu").forEach((btn) => {
        btn.addEventListener("click", () => {
          fichiersSelectionnes.splice(Number(btn.dataset.index), 1);
          afficherApercusMultiples();
        });
      });
    }

    champImage.addEventListener("change", () => {
      fichiersSelectionnes = fichiersSelectionnes.concat(Array.from(champImage.files));
      afficherApercusMultiples();
      champImage.value = ""; // permet de resélectionner sans perdre ce qui est déjà ajouté
    });

    async function envoyerUnePhoto(fichier) {
      const formData = new FormData();
      formData.append("image", fichier);
      const reponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData,
      });
      const data = await reponse.json();
      if (!data.success) throw new Error("Échec de l'envoi d'une photo");
      return data.data.url;
    }

    document.getElementById("form-produit").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const messageEl = document.getElementById("message-produit");
      const boutonPublier = document.getElementById("btn-publier");
      const fichiers = fichiersSelectionnes;

      if (fichiers.length === 0) {
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Choisis au moins une photo.";
        return;
      }

      boutonPublier.disabled = true;
      messageEl.style.color = "#222";
      messageEl.textContent = `Envoi de la photo 1/${fichiers.length}...`;

      try {
        const urlsImages = [];
        for (let i = 0; i < fichiers.length; i++) {
          messageEl.textContent = `Envoi de la photo ${i + 1}/${fichiers.length}...`;
          const url = await envoyerUnePhoto(fichiers[i]);
          urlsImages.push(url);
        }

        messageEl.textContent = "Publication du produit...";

        const vendeurDoc = await db.collection("vendeurs").doc(vendeurConnecte.uid).get();
        const vendeurData = vendeurDoc.data();

        await db.collection("produits").add({
          nom: form.nom.value,
          prix: Number(form.prix.value),
          categorie: form.categorie.value,
          image: urlsImages[0],
          images: urlsImages,
          vendeurId: vendeurConnecte.uid,
          nomVendeur: vendeurData.nomVendeur,
          whatsappVendeur: vendeurData.whatsapp,
          dateAjout: firebase.firestore.FieldValue.serverTimestamp(),
        });

         messageEl.style.color = "green";
        messageEl.textContent = "Produit publié !";
        form.reset();
        fichiersSelectionnes = [];
        apercusMultiples.innerHTML = "";
      } catch (err) {
        console.error(err);
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Erreur : " + err.message;
      } finally {
        boutonPublier.disabled = false;
      }
    });

    function chargerMesProduits() {
      db.collection("produits")
        .where("vendeurId", "==", vendeurConnecte.uid)
        .onSnapshot((snapshot) => {
          const liste = document.getElementById("liste-mes-produits");
          if (snapshot.empty) {
            liste.innerHTML = `<p class="vide">Tu n'as pas encore ajouté de produit.</p>`;
            return;
          }
          liste.innerHTML = snapshot.docs
            .map((doc) => {
              const p = doc.data();
              return `
              <div class="mini-carte-produit">
                <img src="${p.image}" alt="${p.nom}" onerror="this.src='https://placehold.co/200x150?text=Photo'">
                <div class="infos">
                  <p class="nom">${p.nom}</p>
                  <p class="prix">${Number(p.prix).toLocaleString("fr-FR")} F CFA</p>
                  <button data-id="${doc.id}">Supprimer</button>
                </div>
              </div>`;
            })
            .join("");

          liste.querySelectorAll("button[data-id]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              if (confirm("Supprimer ce produit ?")) {
                await db.collection("produits").doc(btn.dataset.id).delete();
              }
            });
          });
        });
    }

    function chargerMesCommandes() {
      db.collection("commandes")
        .where("vendeurIds", "array-contains", vendeurConnecte.uid)
        .onSnapshot((snapshot) => {
          const liste = document.getElementById("liste-mes-commandes");

          const docsVisibles = snapshot.docs.filter((doc) => {
            const c = doc.data();
            const masquees = c.masqueePour || [];
            return !masquees.includes(vendeurConnecte.uid);
          });

          if (docsVisibles.length === 0) {
            liste.innerHTML = `<p class="vide">Aucune commande pour l'instant.</p>`;
            return;
          }

          liste.innerHTML = docsVisibles
            .map((doc) => {
              const c = doc.data();
              const mesArticles = (c.articles || []).filter((a) => a.vendeurId === vendeurConnecte.uid);
              const items = mesArticles.map((a) => `<li>${a.quantite}x ${a.nom}</li>`).join("");
              const sousTotal = mesArticles.reduce((s, a) => s + a.prix * a.quantite, 0);
              const statutActuel = c.statut || "en attente";
              const options = STATUTS_COMMANDE.map(
                (s) => `<option value="${s}" ${s === statutActuel ? "selected" : ""}>${s}</option>`
              ).join("");
              return `
              <div class="carte-commande">
                <div class="entete">
                  <div>
                    <div class="client-nom">${c.client?.nom || "Client"}</div>
                    <div class="client-tel">${c.client?.telephone || ""}</div>
                  </div>
                  <div class="sous-total">${sousTotal.toLocaleString("fr-FR")} F CFA</div>
                </div>
                <div class="livraison">📍 ${c.client?.adresse || ""}, ${c.client?.ville || ""}</div>
                <ul>${items}</ul>
                <div class="pied-commande">
                  <select class="statut-select" data-id="${doc.id}">${options}</select>
                  <button class="btn-suppr-commande" data-suppr-cmd="${doc.id}">Retirer de ma liste</button>
                </div>
              </div>`;
            })
            .join("");

          liste.querySelectorAll(".statut-select").forEach((select) => {
            select.addEventListener("change", async () => {
              await db.collection("commandes").doc(select.dataset.id).update({ statut: select.value });
            });
          });

          liste.querySelectorAll("button[data-suppr-cmd]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              if (confirm("Retirer cette commande de ta liste ?")) {
                await db.collection("commandes").doc(btn.dataset.supprCmd).update({
                  masqueePour: firebase.firestore.FieldValue.arrayUnion(vendeurConnecte.uid),
                });
              }
            });
          });
        }, (erreur) => {
          console.error(erreur);
          document.getElementById("liste-mes-commandes").innerHTML =
            `<p style="color:#D6336C;">Erreur : ${erreur.message}</p>`;
        });
    }
  </script>

</body>
</html>
